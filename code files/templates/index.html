{% extends "base.html" %}
{% block content %}
<section class="hero">
    <div>
        <p class="eyebrow">AI FITNESS PLAN GENERATOR</p>
        <h1>Build your 7-day plan with FitBuddy.</h1>
        <p class="lead">
            Enter a few details and Gemini will create a structured workout plan
            plus a concise nutrition or recovery tip.
        </p>
    </div>
</section>

<section class="card form-card">
    <h2>Your fitness profile</h2>
    <form action="/generate-workout" method="post" class="grid-form">
        <label>
            Name
            <input name="username" required maxlength="120" placeholder="Your name">
        </label>

        <label>
            User ID
            <input name="user_id" required maxlength="80" pattern="[A-Za-z0-9_-]+"
                   placeholder="e.g. user001">
        </label>

        <label>
            Age
            <input type="number" name="age" min="13" max="120" required>
        </label>

        <label>
            Weight (kg)
            <input type="number" name="weight" min="1" max="500" step="0.1" required>
        </label>

        <label>
            Fitness goal
            <select name="goal" required>
                <option value="weight loss">Weight loss</option>
                <option value="muscle gain">Muscle gain</option>
                <option value="general wellness">General wellness</option>
                <option value="flexibility">Flexibility</option>
                <option value="endurance">Endurance</option>
            </select>
        </label>

        <label>
            Workout intensity
            <select name="intensity" required>
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </label>

        <button class="btn primary full" type="submit">Generate 7-Day Plan</button>
    </form>
</section>
{% endblock %}
